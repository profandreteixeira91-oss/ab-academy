[functions.asaas-webhook]
verify_jwt = false
[functions.google-meet-auth]
enabled = true
verify_jwt = false
import_map = "./functions/google-meet-auth/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/google-meet-auth/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/google-meet-auth/*.html" ]

[functions.google-meet-callback]
enabled = true
verify_jwt = false
import_map = "./functions/google-meet-callback/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/google-meet-callback/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/google-meet-callback/*.html" ]
